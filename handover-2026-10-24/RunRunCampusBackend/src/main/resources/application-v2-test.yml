server:
  address: 127.0.0.1
  port: 0
spring:
  application:
    name: runrun-v2-test
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  datasource:
    url: ${RRC_V2_JDBC_URL}
    username: ${RRC_V2_DB_USERNAME}
    password: ${RRC_V2_DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
rrc:
  v2:
    isolated: true
  identity:
    environment: test
    app-id: ${RRC_WECHAT_APP_ID:synthetic-app}
    app-secret: ${RRC_WECHAT_APP_SECRET:synthetic-secret}
