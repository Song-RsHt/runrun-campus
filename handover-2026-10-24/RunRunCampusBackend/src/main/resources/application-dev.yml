spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/runrun_campus}
    username: ${SPRING_DATASOURCE_USERNAME:runrun}
    password: ${SPRING_DATASOURCE_PASSWORD:change-this-before-public-use}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

app:
  proof-storage:
    type: local
    local-directory: ${PROOF_STORAGE_DIR:uploads/order-proofs}
