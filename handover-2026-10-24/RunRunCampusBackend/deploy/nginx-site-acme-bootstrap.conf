# 跑跑代取官网首次签发 HTTPS 证书前使用的临时站点。
# DNS 生效后，通过 /var/www/letsencrypt 完成 HTTP-01 校验；
# 证书签发成功后替换为 nginx-site.conf.example。

server {
    listen 80;
    listen [::]:80;
    server_name runruncampus.cn;

    root /var/www/runruncampus-site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /site.css {
        try_files $uri =404;
    }

    location = /app-icon.png {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
