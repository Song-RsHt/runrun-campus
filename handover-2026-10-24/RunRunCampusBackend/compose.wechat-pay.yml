services:
  api:
    environment:
      WECHAT_PAY_ENABLED: "true"
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:?WECHAT_PAY_APP_ID is required}
      WECHAT_PAY_MERCHANT_ID: ${WECHAT_PAY_MERCHANT_ID:?WECHAT_PAY_MERCHANT_ID is required}
      WECHAT_PAY_MERCHANT_SERIAL_NUMBER: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:?WECHAT_PAY_MERCHANT_SERIAL_NUMBER is required}
      WECHAT_PAY_PRIVATE_KEY_PATH: /run/secrets/WECHAT_PAY_PRIVATE_KEY
      WECHAT_PAY_API_V3_KEY_PATH: /run/secrets/WECHAT_PAY_API_V3_KEY
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:?WECHAT_PAY_NOTIFY_URL is required}
      WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:?WECHAT_PAY_REFUND_NOTIFY_URL is required}
    secrets:
      - source: wechat_pay_private_key
        target: WECHAT_PAY_PRIVATE_KEY
      - source: wechat_pay_api_v3_key
        target: WECHAT_PAY_API_V3_KEY

secrets:
  wechat_pay_private_key:
    file: ${WECHAT_PAY_PRIVATE_KEY_FILE:?WECHAT_PAY_PRIVATE_KEY_FILE is required}
  wechat_pay_api_v3_key:
    file: ${WECHAT_PAY_API_V3_KEY_FILE:?WECHAT_PAY_API_V3_KEY_FILE is required}
